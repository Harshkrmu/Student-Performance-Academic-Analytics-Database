{% extends "base.html" %}
{% block content %}
<h1>Add student</h1>
<div class="card"><form class="inline" method="post">
<label>Name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Date of birth<input type="date" name="dob" required></label>
<label>Department<input name="department" value="Computer Science" required></label>
<label>Semester<input type="number" name="semester" min="1" max="8" value="4" required></label>
<button>Save</button></form></div>
{% endblock %}
